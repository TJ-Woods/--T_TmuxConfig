# =====================================================================
#                      GENERAL & CUSTOM-KEYBINDINGS
# =====================================================================
# Rebind <leader> to C-Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Remove the 500ms lag when pressing the Escape key
set -sg escape-time 10

# Enable the mouse
set -g mouse on

# SAFE RELOAD: Cleanly sources the configuration file without stripping system defaults
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded successfully!"

# Rebind <leader>W to session tree
unbind s
bind W choose-tree -Zs

# Remove confirmation on kill pane/window
bind x kill-pane
bind X kill-window

# Move between panes using Vim directional keys with <leader>
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Map <leader>sv to vsplit and <leader>sh to hsplit
bind-key s display-menu -T "Split Pane " -x P -y P \
    "Vertical Split"   v "split-window -h" \
    "Horizontal Split" h "split-window -v"


# =====================================================================
#                    SMART-SPLITS.NVIM INTEGRATION
# =====================================================================
set -g pane-base-index 1 

# 1. Seamless Navigation (Ctrl + h/j/k/l) - Strict boundary matching
bind-key -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "if -F '#{pane_at_left}'   '' 'select-pane -L'"
bind-key -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "if -F '#{pane_at_top}'    '' 'select-pane -U'"
bind-key -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "if -F '#{pane_at_right}'  '' 'select-pane -R'"

# 2. Seamless Resizing (Ctrl + Arrow Keys) - Matches your 5 (cols) and 2 (lines) logic
bind-key -n C-Left  if -F "#{@pane-is-vim}" "send-keys C-Left"  "resize-pane -L 3"
bind-key -n C-Down  if -F "#{@pane-is-vim}" "send-keys C-Down"  "resize-pane -D 1"
bind-key -n C-Up    if -F "#{@pane-is-vim}" "send-keys C-Up"    "resize-pane -U 1"
bind-key -n C-Right if -F "#{@pane-is-vim}" "send-keys C-Right" "resize-pane -R 3"


# =====================================================================
#                TMUX PLUGIN MANAGER (TPM) INSTALLATIONS
# =====================================================================
# Force TPM to manage plugins inside your ~/.config/tmux directory
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

# TPM
set -g @plugin "tmux-plugins/tpm"
# Better yanking
set -g @plugin "tmux-plugins/tmux-yank"


# =====================================================================
#                        TPM PLUGINS CONFIGURATION
# =====================================================================
# Don't clear selection or scroll to the bottom when releasing the mouse
set -g @yank_action "copy-pipe"


# =====================================================================
#                                STYLING
# =====================================================================
## General
set -g status-style fg=white,bg="#101010"
set -g pane-active-border-style fg="#8000ff",bg="#202020"
set -g pane-border-style fg="#808080",bg="#202020"
set -g window-status-current-style fg="#8000ff",bold,reverse
set -g window-style bg="#202020"
set -g status-right ""

## Visual Menu
# Style visual display menu borders
set -g menu-border-style fg="#8000ff",bg="#202020"

# Style the menu items when selected vs unselected
set -g menu-style fg=white,bg="#202020"
set -g menu-selected-style fg=black,bg=white,bold


# Initialize TMUX plugin manager
run "~/.config/tmux/plugins/tpm/tpm"
